<template id="cart">
  <div class="custom-container cart-div">
    <section class="shopping-cart">
      <h2 class="cart-title">Shopping Cart</h2>
      <div class="div-shopping-cart-content"></div>
      <div class="div-shopcart-btns">
        <button class="shopcart-btn">Continue shopping</button
        ><button class="shopcart-btn">Update cart</button>
      </div>
    </section>
    <section class="cart-totals">
      <h2 class="cart-title">Cart totals</h2>
      <div class="mt-5 mb-2">
        <div class="div-totals-counter border-b border-b-gray-500">
          <span>Subtotal</span
          ><span class="subtotal-counter cart__total-price">0</span>
        </div>
        <div class="div-totals-counter">
          <span>Total</span
          ><span class="total-counter cart__total-price">0</span>
        </div>
      </div>
      <span class="text-ptc">Proceed to checkout</span>
    </section>
  </div>
</template>
